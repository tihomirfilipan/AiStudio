name: Build and release

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

# Needed to create the GitHub release
permissions:
  contents: write

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ./SourceCode/AgOpenGPS.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

  # Path to the output folder
  PUBLISH_DIR: ./AgOpenGPS

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4

    - name: Determine Version
      shell: bash
      run: echo "GitVersion_SemVer=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: dotnet restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      run: dotnet build --no-restore ${{env.SOLUTION_FILE_PATH}}

    - name: Test
      run: dotnet test --no-restore --no-build ${{env.SOLUTION_FILE_PATH}}

    - name: Publish
      run: dotnet publish --no-restore --configuration ${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    # TEMPORARY: the translations (satellite resource folders, one per language) are left out of
    # the release zip; English (neutral) and Croatian stay. Remove this step to ship all languages again.
    - name: Drop translations (temporary)
      shell: powershell
      run: |
        $keep = @('en', 'hr')
        $dirs = @(Get-ChildItem "${{env.PUBLISH_DIR}}" -Directory -Recurse | Where-Object {
          $_.Name -match '^[a-z]{2,3}(-[A-Za-z]{2,4})?$' -and $keep -notcontains $_.Name -and
          (Get-ChildItem $_.FullName -Filter '*.resources.dll' -ErrorAction SilentlyContinue)
        })
        foreach ($d in $dirs) { Remove-Item $d.FullName -Recurse -Force }
        Write-Host "Removed $($dirs.Count) translation folders"

    - name: Create AgOpenGPS_${{ env.GitVersion_SemVer }}.zip
      shell: powershell
      run: Compress-Archive -Path "${{env.PUBLISH_DIR}}/*" -DestinationPath "AgOpenGPS_${{ env.GitVersion_SemVer }}.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ env.GitVersion_SemVer }}
        tag_name: ${{ env.GitVersion_SemVer }}
        target_commitish: ${{ github.sha }}
        body: |
          Automated Release by GitHub Action CI
        draft: false
        prerelease: ${{ contains(github.ref_name, 'release/') }}
        files: AgOpenGPS_${{ env.GitVersion_SemVer }}.zip
